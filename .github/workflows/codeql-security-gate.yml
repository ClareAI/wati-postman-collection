name: CodeQL Security Gate

on:
  pull_request:
    branches:
      - "master"

jobs:
  codeql-security-gate:
    uses: ClareAI/devops-github-workflow/.github/workflows/codeql-security-gate.yml@master
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
      security-events: read
    with:
      # Report only during rollout. Remove after review, then make this a required check.
      soft-fail: true
